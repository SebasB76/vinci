<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vinci · Propuesta E</title>
  <link rel="stylesheet" href="tg.css">
  <script src="data.js"></script>
  <style>
    main { max-width: 480px; margin: 0 auto; padding: 16px 14px 28px; }
    .term { background: var(--tg-section-bg-color); border-radius: 18px; padding: 16px 16px 12px; }
    .term .head { display: flex; align-items: baseline; gap: 8px; }
    .term .head h1 { margin: 0; font-size: 18px; }
    .term .head .pct { margin-left: auto; font-size: 13px; color: var(--tg-hint-color); }
    .term .head .pct b { font-size: 20px; color: var(--tg-text-color); }
    .line { position: relative; height: 64px; margin: 14px 4px 0; }
    .line .rail { position: absolute; left: 0; right: 0; top: 34px; height: 6px; border-radius: 3px; background: var(--line); }
    .line .gone { position: absolute; left: 0; top: 34px; height: 6px; border-radius: 3px; background: var(--tg-button-color); }
    .line .today { position: absolute; top: 4px; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--tg-button-color);
                   display: grid; justify-items: center; gap: 2px; }
    .line .today::after { content: ""; width: 2px; height: 22px; background: var(--tg-button-color); border-radius: 1px; }
    .line .pin { position: absolute; top: 30px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 3px solid var(--tg-section-bg-color);
                 background: var(--tg-text-color); cursor: pointer; padding: 0; }
    .line .pin.hot { background: var(--bad); z-index: 2; }
    .line .pin.off { opacity: .25; }
    .months { position: relative; height: 16px; margin: 0 4px; font-size: 11px; color: var(--tg-hint-color); }
    .months span { position: absolute; transform: translateX(-50%); }
    .months span::before { content: ""; position: absolute; left: 50%; top: -14px; width: 1px; height: 8px; background: var(--line); }
    .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--tg-hint-color); margin-top: 6px; }
    .grp { margin: 22px 4px 8px; display: flex; align-items: baseline; gap: 8px; }
    .grp h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
    .grp h2.hot { color: var(--bad); }
    .grp span { font-size: 13px; color: var(--tg-hint-color); }
    .list { background: var(--tg-section-bg-color); border-radius: 16px; overflow: hidden; }
    .it { display: flex; gap: 12px; align-items: center; padding: 10px 14px; min-width: 0; transition: opacity .2s; }
    .it + .it { border-top: 1px solid var(--line); }
    .date { flex: none; width: 42px; text-align: center; line-height: 1.05; }
    .date small { display: block; font-size: 11px; text-transform: uppercase; color: var(--tg-hint-color); }
    .date b { font-size: 20px; }
    .hotlist .date b, .hotlist .date small { color: var(--bad); }
    .it .body { flex: 1; min-width: 0; }
    .it .t { font-weight: 500; }
    .it .s { font-size: 13px; color: var(--tg-hint-color); }
    .wt { font-size: 12px; font-weight: 700; color: var(--tg-hint-color); white-space: nowrap; }
    .check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--tg-hint-color) 60%, transparent);
             background: none; cursor: pointer; display: grid; place-items: center; color: transparent; font-size: 14px; padding: 0; }
    .it.done { opacity: .4; }
    .it.done .t { text-decoration: line-through; }
    .it.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
    .it.flash { background: color-mix(in srgb, var(--tg-button-color) 14%, transparent); }
    .feedhead { display: flex; align-items: baseline; margin: 26px 4px 8px; }
    .feedhead h2 { margin: 0; font-size: 20px; }
    .feedhead button { margin-left: auto; border: 0; background: none; color: var(--tg-button-color); font-weight: 600; cursor: pointer; font-size: 14px; }
    .nw { display: flex; gap: 12px; padding: 11px 14px; align-items: flex-start; min-width: 0; }
    .nw + .nw { border-top: 1px solid var(--line); }
    .nw .ic { font-size: 20px; flex: none; }
    .nw .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--tg-button-color); flex: none; margin-top: 7px; }
    .nw.read .unread { visibility: hidden; }
    .nw.read .t { color: var(--tg-hint-color); }
    .foot { text-align: center; font-size: 12px; color: var(--tg-hint-color); margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <section class="term">
    <div class="head"><h1 id="name"></h1><span class="pct"><b id="pct"></b> · semana <span id="wk"></span></span></div>
    <div class="line" id="line"><div class="rail"></div></div>
    <div class="months" id="months"></div>
    <div class="legend"><span>24 sep</span><span id="left"></span><span>15 ene</span></div>
  </section>

  <div id="groups"></div>

  <div class="feedhead"><h2>Novedades</h2><button type="button" id="readAll">Marcar como leídas</button></div>
  <div class="list" id="news"></div>

  <div class="foot" id="foot"></div>
</main>
<script>
const S = window.SNAPSHOT, sem = semester();
const $ = (id) => document.getElementById(id);
const at = (date) => Math.min(100, Math.max(0, (date - sem.start) / (sem.end - sem.start) * 100));
const WD = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"], MO = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

$("name").textContent = sem.name;
$("pct").textContent = sem.pct + "%";
$("wk").textContent = `${sem.week} de ${sem.weeks}`;
$("left").textContent = `faltan ${sem.daysLeft} días`;

const line = $("line");
line.insertAdjacentHTML("beforeend", `<div class="gone" style="width:${sem.pct}%"></div><div class="today" style="left:${sem.pct}%">HOY</div>`
  + S.deliverables.filter((d) => d.kind !== "pendiente").map((d) => `<button class="pin ${d.hours <= 24 ? "hot" : ""}" data-pin="${d.id}"
      style="left:${at(dueDate(d))}%" aria-label="${d.title}" title="${d.title}"></button>`).join(""));
$("months").innerHTML = [["oct", "2026-10-01"], ["nov", "2026-11-01"], ["dic", "2026-12-01"], ["ene", "2027-01-01"]]
  .map(([m, d]) => `<span style="left:${at(new Date(d + "T00:00"))}%">${m}</span>`).join("");

const groups = [
  ["Hoy", (d) => d.hours <= 24, true],
  ["Esta semana", (d) => d.hours > 24 && d.day < 7, false],
  ["Más adelante", (d) => d.day >= 7, false],
];
$("groups").innerHTML = groups.map(([title, test, hot]) => {
  const items = S.deliverables.filter(test).sort((a, b) => a.hours - b.hours);
  if (!items.length) return "";
  return `<div class="grp"><h2 class="${hot ? "hot" : ""}">${title}</h2><span>${items.length}</span></div>
    <div class="list ${hot ? "hotlist" : ""}">${items.map((d) => {
      const date = dueDate(d), s = subjectOf(d.code);
      return `<div class="it" id="it-${d.id}">
        <button class="check" data-check aria-label="Marcar ${d.title}">✓</button>
        <div class="body"><div class="t ellipsis">${d.kind === "pendiente" ? "📌 " : d.kind === "cuestionario" ? "⏱️ " : ""}${d.title}</div>
          <div class="s ellipsis">${s ? s.name : "Personal"}${d.due.includes(":") ? " · " + d.due.split(" ")[1] : ""}</div></div>
        ${d.weight ? `<span class="wt">${d.weight}%</span>` : ""}
        <div class="date"><small>${WD[date.getDay()]}</small><b>${date.getDate()}</b>${date.getMonth() !== 9 ? `<small>${MO[date.getMonth()]}</small>` : ""}</div>
      </div>`;
    }).join("")}</div>`;
}).join("");

$("news").innerHTML = S.news.map((n, i) => `<div class="nw ${i > 1 ? "read" : ""}"><span class="unread"></span><span class="ic">${n.icon}</span>
  <div style="min-width:0;flex:1"><div class="t">${n.text}</div><div class="s hint" style="font-size:13px">${n.kind} · ${subjectOf(n.code).name} · ${n.when}</div></div></div>`).join("");
$("foot").textContent = `Aula leída ${S.status.poll} · datos de ${S.generated}`;

document.addEventListener("click", (e) => {
  const check = e.target.closest("[data-check]"), pin = e.target.closest("[data-pin]");
  if (check) {
    const it = check.closest(".it"), on = it.classList.toggle("done");
    const pinEl = document.querySelector(`[data-pin="${it.id.slice(3)}"]`); if (pinEl) pinEl.classList.toggle("off", on);
    if (on) toast("Le manda a Vinci el mismo aviso que «✅ Ya lo entregué»");
  } else if (pin) {
    const it = $("it-" + pin.dataset.pin); it.scrollIntoView({ behavior: "smooth", block: "center" });
    it.classList.add("flash"); setTimeout(() => it.classList.remove("flash"), 900);
  } else if (e.target.id === "readAll") document.querySelectorAll(".nw").forEach((n) => n.classList.add("read"));
});
</script>
</body>
</html>
