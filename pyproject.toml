[project]
name = "espol-academic-bot"
version = "0.1.0"
description = "Bot académico de Telegram para las materias de ESPOL en Canvas (aulavirtual)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.scripts]
aula = "aula.cli:main"
espol-bot = "espol_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aula_core", "src/aula", "src/espol_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
