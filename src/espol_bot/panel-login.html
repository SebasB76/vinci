<!doctype html>
<!-- The panel's door when Google sign-in is on (panel.py, `espol-bot panel --google`): Google's button gives an ID
     token, /entrar checks it is the captain's account and sets the session cookie. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F4F0">
<title>Panel de Vinci</title>
<link rel="icon" href="/vinci/logo.png">
<link rel="stylesheet" href="/vinci/vinci.css?v=5">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
body { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
main.door { width: 100%; max-width: 400px; padding: 0; gap: 14px; }
.v-sheet { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 32px 24px 28px; }
.v-sheet img { width: 72px; height: 72px; border-radius: 20px; }
h1 { margin: 0; font: 500 26px/1.1 var(--display); letter-spacing: -0.02em; }
.lead { margin-top: 6px; font-size: 15px; color: var(--ink-2); }
.gbtn { min-height: 44px; display: grid; place-items: center; }
#status[data-kind="busy"] { color: var(--ink-3); }
</style>
</head>
<body>
<main class="door">
  <div class="v-sheet">
    <img src="/vinci/logo.png" alt="">
    <div>
      <h1>Panel de Vinci</h1>
      <p class="lead">Mira cómo va Vinci con cada persona.</p>
    </div>
    <div id="g_id_onload" data-client_id="{{CLIENT_ID}}" data-callback="signedIn" data-auto_prompt="false"></div>
    <div class="gbtn"><div class="g_id_signin" data-type="standard" data-text="signin_with" data-shape="pill" data-size="large" data-locale="es"></div></div>
    <p class="status" id="status"></p>
  </div>
  <ul class="trust">
    <li><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span><b>Solo entra la cuenta del dueño.</b> Cualquier otra cuenta de Google ve un error.</span></li>
    <li><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>El panel no muestra el texto de los chats de tus amigos, solo tiempos y herramientas.</span></li>
  </ul>
</main>
<script>
async function signedIn(response) {
  const status = document.getElementById("status");
  status.dataset.kind = "busy";
  status.textContent = "Entrando…";
  try {
    const res = await fetch("/entrar", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({credential: response.credential})});
    if (res.ok) { location.replace("/"); return; }
    status.textContent = (await res.json()).error || "No pude entrar.";
  } catch (e) {
    status.textContent = "No pude entrar: " + e;
  }
  status.dataset.kind = "error";
}
</script>
</body>
</html>
