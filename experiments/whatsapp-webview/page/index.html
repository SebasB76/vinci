<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Formulario de prueba</title>
  <link rel="stylesheet" href="/demo.css">
  <script type="module" src="/demo.js"></script>
</head>
<body>
  <main>
    <p class="tag">Experimento · datos ficticios</p>
    <h1>Formulario de prueba</h1>
    <p>Ejecución <strong id="run">…</strong></p>
    <form id="form" hidden>
      <label for="value">Escribe un texto de prueba</label>
      <input id="value" name="value" maxlength="200" autocomplete="off" required placeholder="Por ejemplo: hola desde el iPhone">
      <button id="save" type="submit">Guardar</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
