# The party: each bot's profile photo, from the captain's «TU PARTY» art, and each subject bot's name.
#
# `avatar` is a JPG in hermes/avatars/ that setup.sh sets as the bot's Telegram profile photo. `name`
# is the subject bot's Telegram name: just its subject, in a readable form within Telegram's 64
# characters (a short form when the official one is long). Subjects are keyed by their ESPOL code,
# so a subject's theory and práctico share one entry. A subject that is not here is named after its
# `nombre` in materias.toml and keeps whatever photo it has.
#
# Run ./setup.sh again after editing this file.

[vinci]
avatar = "wizard.jpg"

[subjects.SOFG1007]
subject = "Ingeniería de Software I"
name = "Ingeniería de Software I"
avatar = "robot.jpg"

[subjects.CCPG1041]
subject = "Dirección de Proyectos Informáticos"
name = "Dirección de Proyectos Informáticos"
avatar = "builder.jpg"

[subjects.CCPG1055]
subject = "Sistemas Distribuidos y Computación en la Nube"
name = "Sistemas Distribuidos"
avatar = "server.jpg"

[subjects.ESTG1034]
