# Configuración de Vinci, tus bots de materia y la herramienta `aula`.
# Este es el único archivo que necesitas tocar para cambiar horarios y recordatorios.
# (Tu horario de clases y tu equipo de bots viven en la carpeta de datos: horario.toml y materias.toml.)
# Después de editarlo, vuelve a correr ./setup.sh para que Hermes tome los cambios
# (la frecuencia del sondeo y la hora del resumen viven en los cron jobs de Hermes).

[canvas]
# Tu aula virtual (Canvas LMS). Los datos académicos solo se leen, salvo el PDF que entregas con el botón
# «📤 Entregar» de un bot de materia; Vinci también crea y borra
# exclusivamente sus propios tokens para esquivar el vencimiento oculto de una hora de ESPOL.
url = "https://aulavirtual.espol.edu.ec"
# El comando `aula` reutiliza los datos locales si tienen menos de estos minutos;
# si son más viejos, vuelve a leer el aula virtual antes de responder.
cache_minutos = 10
# Pausa mínima entre dos consultas del sondeo al aula virtual (segundos), para que su tráfico
# nunca parezca abuso. Lo que le preguntas a un bot en Telegram no espera esta pausa.
request_interval_seconds = 1.0
# El formulario de /token (docs/token/ publicado en GitHub Pages). No guarda nada, así que cualquier instalación
# puede usar esta copia; cámbialo solo si publicas la tuya.
token_form_url = "https://sebasb76.github.io/vinci/token/"

[general]
# Zona horaria para fechas, recordatorios y el resumen.
zona_horaria = "America/Guayaquil"

[notificaciones]
# Cada cuántos minutos el bot revisa el aula virtual.
intervalo_minutos = 30
# Recordatorios antes de cada entrega que aún no has enviado (en horas).
recordatorios_horas = [24, 3]
# Hora del resumen diario de la semana (formato 24 h, HH:MM).
resumen_diario = "07:00"
# Si en un mismo sondeo hay más avisos que este número, se agrupan en un solo mensaje.
max_mensajes_por_sondeo = 8

[clases]
# Cada bot de materia te manda su brief (repaso, entregas, material nuevo, conceptos clave y una
# pregunta para la clase) estos minutos antes de cada clase de tu horario.
brief_minutos_antes = 30

[submissions]
# Materias cuyas actividades haces a mano y entregas en PDF (por su código). En el aviso de una tarea nueva y en
# sus recordatorios, Vinci te recuerda que le mandes las fotos al bot de la materia, que arma el PDF y la entrega.
# También lo recuerda en cualquier materia cuando la tarea pide escanear o hacerla a mano.
handwritten = ["ESTG1034"]

[notes]
# La carpeta donde escribes tus apuntes en Markdown (Omawrite con su carpeta de notas, Obsidian…). Vinci la revisa
# cada minuto: decide de qué materia es cada nota, le pasa al bot de la materia las líneas «//vinci <pregunta>» y,
# cuando la clase terminó y la nota lleva un rato sin cambios, le pide el resumen. Vacía: no lee nada.
folder = "~/Notes"
# Minutos sin cambios para dar una nota por terminada.
idle_minutes = 15

[material]
# Tipos de archivo del aula que los bots leen (además de las páginas web que abren desde un enlace).
# Solo el sílabo de cada curso se baja solo; lo demás queda en el catálogo y el bot de la materia
# lo baja cuando lo necesita.
extensiones = ["pdf", "pptx", "docx"]
# Nada más grande que esto se baja (un libro escaneado puede pesar más de 100 MB).
tamano_maximo_mb = 200
# Cuántos sílabos baja como máximo cada sondeo (MB); los demás, en los siguientes.
max_mb_per_sync = 50

[almacenamiento]
# Dónde se guardan la base de datos y el material descargado (queda en tu PC). El PDF de un libro
# principal de más de 20 MB (lo que Telegram deja pasar a un bot) va en libros/<CÓDIGO>/ de esta carpeta.
carpeta_datos = "~/.local/share/espol-academic-bot"

[hermes]
# Perfil de Hermes de Vinci. Cada bot de materia usa su propio perfil: <perfil>-<código>
# (ej. vinci-estg1034). Si venías del bot «espol», setup.sh lo convierte en Vinci con su memoria.
perfil = "vinci"
# Modelo de Vinci y de los bots de materia (los avisos del aula y la agenda no gastan tokens;
# solo las respuestas, los briefs y lo que les pases).
proveedor = "anthropic"
modelo = "claude-sonnet-5-5"

[hermes.herramientas]
# Herramientas de Hermes que cada bot tiene APAGADAS y puedes encender. Nadie las trae de fábrica:
# escribe los nombres que quieras, vuelve a correr ./setup.sh y reinicia el gateway (hermes gateway restart).
# Quitar un nombre la vuelve a apagar. La tabla con el riesgo de cada una está en el README (Seguridad y privacidad).
#   terminal, file, code_execution, browser, computer_use, delegation, cronjob, kanban, vision, video,
#   image_gen, video_gen, tts, todo, connections, homeassistant, spotify, x_search, a2a
#   (a los bots de materia además: web, search)
# Ejemplo: vinci = ["terminal", "file"]
vinci = []
# Para todos los bots de materia.
materias = []

[hermes.herramientas.por_materia]
# Para un solo bot de materia, por su código (se suma a `materias`). Ejemplo: ESTG1034 = ["code_execution"]
